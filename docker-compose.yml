services:
  kinobot:
    build: .
    container_name: kinobot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Persist SQLite DB inside the mounted ./data directory
      DB_NAME: /app/data/kinobot.db
      COOKIES_FILE: /app/data/cookies.txt
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
